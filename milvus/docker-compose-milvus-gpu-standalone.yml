# Milvus GPU单机版配置
services:
  # Etcd 配置
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    ports:
      - "2379:2379"
    volumes:
      - ${MILVUS_DATA_PATH:-.}/data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  # Minio 配置
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${MILVUS_DATA_PATH:-.}/data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus 单机版配置 (Standalone)
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.6-gpu
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MILVUS_ENABLE_GPU=true
#      - COMMON_SECURITY_AUTHENTICATIONENABLED=true   # 启用认证功能
#      - COMMON_SECURITY_AUTHORIZATIONENABLED=true    # 启用授权功能 (推荐)
#      - ROOTCOORD_CREDENTIAL_USERNAME=${MILVUS_USERNAME:-123456}    # <--- 在这里设置你的用户名
#      - ROOTCOORD_CREDENTIAL_PASSWORD=${MILVUS_PASSWORD:-123456}  # <--- 在这里设置你的密码
    volumes:
      - ${MILVUS_DATA_PATH:-.}/data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # Attu - Milvus 管理界面
  attu:
    image: zilliz/attu:latest
    container_name: attu
    restart: unless-stopped
    environment:
      - MILVUS_URL=standalone:19530
    ports:
      - "3000:3000"
    depends_on:
      - standalone