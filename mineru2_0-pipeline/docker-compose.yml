services:
  mineru-tianshu:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: mineru-tianshu
    
    # GPU 支持配置 (需要 docker 安装 nvidia-container-toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # 使用所有 GPU，也可以指定数量如 count: 1
              capabilities: [gpu]
    
    # 环境变量文件
    env_file:
      - mineru.env
    
    # 额外的环境变量（可选，会覆盖 mineru.env 中的配置）
    environment:
      - TZ=Asia/Shanghai
      - OUTPUT_DIR=/app/output
      
      # ============================================
      # Worker 配置
      # ============================================
      # 每个 GPU 的 worker 数量（默认: 1）
      # 建议根据显存调整：8GB=1, 12GB=1-2, 24GB=2-3
      - WORKERS_PER_DEVICE=1
      
      # 使用的 GPU 设备（默认: auto）
      # auto: 使用所有 GPU
      # 0: 只使用 GPU 0
      # 0,1: 使用 GPU 0 和 1
      - DEVICES=auto
      
      # 加速器类型（默认: auto）
      # auto: 自动检测
      # cuda: NVIDIA GPU
      # cpu: CPU 模式
      # mps: Apple Silicon
      - ACCELERATOR=auto
      
      # ============================================
      # 服务端口配置
      # ============================================
      - API_PORT=8000
      - WORKER_PORT=9000
      
      # ============================================
      # 文件清理配置
      # ============================================
      # 自动清理 N 天前的结果文件 (0=禁用)
      - CLEANUP_OLD_FILES_DAYS=7
      
      # ============================================
      # MinIO 配置（如果需要图片上传功能）
      # ============================================
      # - MINIO_ENDPOINT=your-endpoint.com
      # - MINIO_ACCESS_KEY=your-access-key
      # - MINIO_SECRET_KEY=your-secret-key
      # - MINIO_BUCKET=your-bucket
    
    # 端口映射
    ports:
      - "18000:8000"  # API Server
      - "19000:9000"  # LitServe Worker
    
    # 数据卷挂载
    volumes:
      # 配置文件挂载
      - ./mineru.json:/app/mineru.json:ro
      
      # 模型文件夹挂载（重要：需要提前下载模型）
      # 请根据实际路径修改，这里假设模型在当前目录的 PDF-Extract-Kit-1.0 文件夹
      - ./PDF-Extract-Kit-1.0:/app/models/PDF-Extract-Kit-1.0:ro
      
      # 输出目录持久化（对应代码中的 /tmp/mineru_tianshu_output）
      - ./output:/tmp/mineru_tianshu_output
      
      # SQLite 数据库持久化（数据库保存在 /app/data/ 目录）
      - ./data:/app/data
    
    # 工作目录
    working_dir: /app
    
    # 重启策略
    restart: unless-stopped
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

# 网络配置（可选）
networks:
  default:
    name: mineru-network
    driver: bridge
